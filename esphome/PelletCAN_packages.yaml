              id(net_esp)++; id(net_t) = millis() | 1; if (id(net_t0) == 0) id(net_t0) = millis() | 1;
              const uint8_t cs = x[0];
              std::vector<uint8_t> r(8, 0);
              const uint32_t rid = 0x580 + ${can_node_id};
              static std::string seg_data;
              static size_t seg_pos = 0;
              auto abort_with = [&](uint32_t code) {
                r[0] = 0x80; r[1] = x[1]; r[2] = x[2]; r[3] = x[3];
                for (int i = 0; i < 4; i++) r[4 + i] = (code >> (8 * i)) & 0xFF;
                id(igneo_can)->send_data(rid, false, r);
              };
              if (cs == 0x40) {
                const uint16_t idx = x[1] | (x[2] << 8);
                const uint8_t sub = x[3];
                auto exp = [&](uint32_t v, int n) {
                  r[0] = 0x43 | ((4 - n) << 2); r[1] = x[1]; r[2] = x[2]; r[3] = x[3];
                  for (int i = 0; i < n; i++) r[4 + i] = (v >> (8 * i)) & 0xFF;
                  id(igneo_can)->send_data(rid, false, r);
                };
                auto str = [&](const std::string &t) {
                  if (t.size() <= 4) {
                    r[0] = 0x43 | ((4 - (int) t.size()) << 2); r[1] = x[1]; r[2] = x[2]; r[3] = x[3];
                    for (size_t i = 0; i < t.size(); i++) r[4 + i] = (uint8_t) t[i];
                  } else {
                    seg_data = t; seg_pos = 0;
                    r[0] = 0x41; r[1] = x[1]; r[2] = x[2]; r[3] = x[3];
                    for (int i = 0; i < 4; i++) r[4 + i] = (t.size() >> (8 * i)) & 0xFF;
                  }
                  id(igneo_can)->send_data(rid, false, r);
                };
                if (idx == 0x1000 && sub == 0) exp(0, 4);
                else if (idx == 0x1001 && sub == 0) exp(0, 1);
                else if (idx == 0x1008 && sub == 0) str("PelletCAN");
                else if (idx == 0x100A && sub == 0) str("v${fw_version}");
                else if (idx == 0x1018 && sub == 0) exp(4, 1);
                else if (idx == 0x1018 && sub == 1) exp(0x4E4350, 4);  // identyfikator producenta (PCN)
                else if (idx == 0x1018 && sub == 2) exp(${can_product}, 4);          // produkt (kod, wg ktorego panel dobiera nazwe)
                else if (idx == 0x1018 && sub == 3) exp(1, 4);          // rewizja
                else if (idx == 0x1018 && sub == 4) exp(1, 4);          // numer seryjny
                else abort_with(0x06020000);
              } else if ((cs & 0xE0) == 0x60) {
                // kolejny segment napisu (bit 4 = toggle zadany przez klienta)
                const size_t left = seg_data.size() > seg_pos ? seg_data.size() - seg_pos : 0;
                const size_t n = left > 7 ? 7 : left;
                r[0] = (cs & 0x10) | ((7 - n) << 1) | (left <= 7 ? 1 : 0);
                for (size_t i = 0; i < n; i++) r[1 + i] = (uint8_t) seg_data[seg_pos + i];
                seg_pos += n;
